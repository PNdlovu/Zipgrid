name: AI Service — CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/ai-service/**'
      - '.github/workflows/ai-service-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/ai-service/**'

defaults:
  run:
    working-directory: apps/ai-service

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy core/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_CI }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zipgrid_test
          REDIS_URL: redis://localhost:6379
          AI_SERVICE_SECRET: ci-test-secret

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zipgrid_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']
