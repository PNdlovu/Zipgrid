name: Deploy — Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Web app → Vercel ──────────────────────────────────────────
  deploy-web:
    name: Deploy web → Vercel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
          working-directory: apps/web
          vercel-args: '--prod'

  # ── OCPP service → Railway ────────────────────────────────────
  deploy-ocpp:
    name: Deploy OCPP → Railway
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy OCPP service
        run: railway up --service ocpp-service --detach
        working-directory: apps/ocpp-service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ── AI service → Railway ──────────────────────────────────────
  deploy-ai:
    name: Deploy AI service → Railway
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy AI service
        run: railway up --service ai-service --detach
        working-directory: apps/ai-service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
