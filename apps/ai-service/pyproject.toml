[project]
name = "zipgrid-ai-service"
version = "0.1.0"
description = "Zipgrid AI/Voice Service — LangChain + FastAPI"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "openai>=1.30.0",
    "pinecone-client>=3.2.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
